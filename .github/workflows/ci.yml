# Minimal CI (added 2026-09-01). The repo had tests, typecheck and lint but no
# workflow: PRs (including Dependabot's, which piled up unreviewed) carried no
# machine verdict, and "merge only on green CI" was an empty condition here.
# Deliberately minimal: no wrangler deploy step (needs auth and does not belong
# in a PR gate); prettier is not enforced (17 legacy files are non-conformant).
# npm audit (added 2026-10-08): CLAUDE.md demands `npm audit --audit-level=high`
# with exit 0 before every commit, but CI never checked it, so four high
# advisories in the dev chain (wrangler > miniflare > undici, sharp) went
# unnoticed after #36. Same gate as startup-finance-toolkit; it runs last so a
# red audit still shows the typecheck, lint and test verdicts.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
