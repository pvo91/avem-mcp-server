# Minimal CI (added 2026-09-01). The repo had tests, typecheck and lint but no
# workflow: PRs (including Dependabot's, which piled up unreviewed) carried no
# machine verdict, and "merge only on green CI" was an empty condition here.
# Deliberately minimal: no wrangler deploy step (needs auth and does not belong
# in a PR gate); prettier is not enforced (17 legacy files are non-conformant).
# npm audit (added 2026-10-08): CI never checked the audit, so four high
# advisories in the dev chain (wrangler > miniflare > undici, sharp) went
# unnoticed after #36. Split like startup-finance-toolkit (Patric decision
# 08.10.2026): shipped dependencies block from high, dev tooling only from
# critical, so a dev-only high advisory without a patched release cannot keep
# every PR red. The stricter local gate in CLAUDE.md (high, all dependencies)
# stays. The audit steps run last so a red audit still shows the typecheck,
# lint and test verdicts.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Audit shipped dependencies (high)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies (critical)
        run: npm audit --audit-level=critical
