name = "avem-mcp-server"
main = "src/index.ts"
compatibility_date = "2026-05-18"
compatibility_flags = ["nodejs_compat"]

# Free Tier: 100k requests/day, 10ms CPU per request.
# Bumps automatic if needed (we won't hit it on v1).

[observability]
enabled = true

# Production environment binds custom domain.
# DNS-CNAME `mcp.avemhq.com` must point to <workers-subdomain> first,
# then Custom Domain via Cloudflare Dashboard -> Workers -> Triggers.
[env.production]
name = "avem-mcp-server"
routes = [
  { pattern = "mcp.avemhq.com", custom_domain = true }
]

# vars are NOT inherited from top-level by named environments — must be
# repeated here (Cloudflare wrangler behavior). Without this block the
# production deploy would have BEEHIIV_PUBLICATION_ID / GITHUB_USERNAME
# undefined -> get_content + get_open_source broken.
[env.production.vars]
AVEM_PRIMARY_DOMAIN = "avemhq.com"
AVEM_BRAND_TAGLINE = "Systems over headcount"
BEEHIIV_PUBLICATION_ID = "pub_72eb5446-bb81-4a10-9040-84076e4e5283"
GITHUB_USERNAME = "pvo91"
CACHE_TTL_SECONDS = "300"

# Secrets — set via `wrangler secret put` (NOT committed):
#   wrangler secret put BEEHIIV_API_KEY --env production   # Beehiiv REST API V2 key
#   wrangler secret put GITHUB_TOKEN --env production       # GitHub PAT (public_repo scope; rate-limit bump)

[vars]
# Non-secret public config.
AVEM_PRIMARY_DOMAIN = "avemhq.com"
AVEM_BRAND_TAGLINE = "Systems over headcount"
BEEHIIV_PUBLICATION_ID = "pub_72eb5446-bb81-4a10-9040-84076e4e5283"
GITHUB_USERNAME = "pvo91"
CACHE_TTL_SECONDS = "300"
